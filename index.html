<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Tugas | ROBI-1973</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid #334155;
    }
    h1 {
      color: #3b82f6;
      margin-bottom: 30px;
    }
    .btn {
      display: block;
      width: 100%;
      background: #3b82f6;
      color: white;
      padding: 15px 20px;
      margin-bottom: 15px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      box-sizing: border-box;
      transition: background 0.3s, transform 0.1s;
    }
    .btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }
    .btn-dark {
      background: #06b6d4;
    }
    .btn-dark:hover {
      background: #0891b2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Portal Praktikum 13</h1>
    <a href="Akt1/" class="btn">🚀 Buka Tugas 1 (Web Profil)</a>
    <a href="Akt2/" class="btn btn-dark">📟 Buka Tugas 2 (IoT Dashboard)</a>
  </div>
</body>
</html>
